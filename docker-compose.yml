# Khayal with Docker: the API (simulator in mock mode, dashboard, webhooks) and the MCP server
# as two containers from one image, sharing one SQLite file (WAL) in a named volume.
#
#   docker compose up --build        then http://localhost:8000/simulator
#
# Settings come from .env if it exists (optional; KHAYAL_ENV_FILE picks another file).
# APP_MODE=mock needs no keys: the init step makes random secrets on first start.
# APP_MODE=dev/aws: init refuses to start anything without SESSION_SECRET and
# MCP_TOKEN_SECRET of 32+ characters, or with MCP_AUTH_MODE=secret (and the rest of the
# startup check).
# SQLite on a shared volume is for a demo on one host, not for several hosts.

name: khayal

x-khayal: &khayal
  build: .
  image: khayal:local
  env_file:
    - path: ${KHAYAL_ENV_FILE:-.env}
      required: false
  volumes:
    - khayal-data:/data

# Fixed for the containers, whatever .env says (it may point at local paths).
x-env: &env
  DATABASE_URL: sqlite:////data/khayal.db
  VOICE_CACHE_DIR: /data/voice_cache
  MCP_SERVER_URL: http://mcp:8001/mcp

services:
  init:
    <<: *khayal
    command: ["init"]
    environment: *env
    restart: "no"
    healthcheck:
      disable: true

  mcp:
    <<: *khayal
    command: ["mcp"]
    environment:
      <<: *env
      MCP_HOST: 0.0.0.0 # reachable from the api container; never published to the host
    expose: ["8001"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  api:
    <<: *khayal
    command: ["api"]
    environment: *env
    ports:
      - "127.0.0.1:${KHAYAL_PORT:-8000}:8000" # this machine only (the mock simulator has no sign-in)
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy

volumes:
  khayal-data:

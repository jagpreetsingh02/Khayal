<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="700" viewBox="0 0 1810 700" font-family="Inter, DejaVu Sans, Arial, sans-serif">
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="118%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1f3a5f" flood-opacity="0.16"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#35527d"/></marker></defs>
<style>.title{font-size:34px;font-weight:700;fill:#12284a}.sub{font-size:17px;fill:#4a5d78}.st{font-size:13px;font-weight:700;fill:#7a8aa5;letter-spacing:1px}
.bt{font-size:21px;font-weight:700}.bsub{font-size:14px;fill:#5d6f8a}.bl{font-size:15px;fill:#2a3a52}.al{font-size:13px;font-weight:600;fill:#35527d}.bn{font-size:15px;font-weight:700;fill:#fff}
.cp{font-size:17px;font-weight:700;fill:#1c6a37}.cl{font-size:14.5px;fill:#2a3a52}.foot{font-size:15px;fill:#2a3a52}.footb{font-size:17px;font-weight:700;fill:#12284a}</style>
<rect width="1810" height="700" fill="#fff"/>
<text x="40" y="52" class="title">Khayal in one picture</text>
<text x="40" y="82" class="sub">A WhatsApp photo of a meter becomes a confirmed reading and a family that knows. The AI only acts through narrow, audited MCP tools.</text>
<rect x="40" y="125" width="290" height="215" rx="14" fill="#fff" stroke="#5b7aa6" stroke-width="2.2" filter="url(#sh)"/>

<text x="62" y="159" class="st">1</text>
<text x="62" y="187" class="bt" fill="#1f3a5f">Parent</text>
<text x="62" y="219" class="bl">• Sends a photo of the BP or</text>
<text x="62" y="243" class="bl">• glucose meter, or a strip</text>
<text x="62" y="267" class="bl">• Replies 1 (yes) or 2 (no)</text>
<rect x="400" y="125" width="290" height="215" rx="14" fill="#fff" stroke="#5b7aa6" stroke-width="2.2" filter="url(#sh)"/>

<text x="422" y="159" class="st">2</text>
<text x="422" y="187" class="bt" fill="#1f3a5f">Khayal reads it</text>
<text x="422" y="219" class="bl">• Vision reader reads the screen</text>
<text x="422" y="243" class="bl">• Read-back: "I read 186/121.</text>
<text x="422" y="267" class="bl">• Correct?" Counts only after 1</text>
<text x="422" y="291" class="bl">• Clinical rules, durable inbox</text>
<rect x="760" y="125" width="290" height="215" rx="14" fill="#f1f8f3" stroke="#2f8f4e" stroke-width="2.2" filter="url(#sh)"/>

<text x="782" y="159" class="st">3</text>
<text x="782" y="187" class="bt" fill="#1c6a37">MCP server</text>
<text x="782" y="219" class="bl">• 7 narrow tools</text>
<text x="782" y="243" class="bl">• Signed token on every call</text>
<text x="782" y="267" class="bl">• Server-side guardrails</text>
<text x="782" y="291" class="bl">• No approve tool exists</text>
<rect x="1120" y="125" width="290" height="215" rx="14" fill="#fff" stroke="#5b7aa6" stroke-width="2.2" filter="url(#sh)"/>

<text x="1142" y="159" class="st">4</text>
<text x="1142" y="187" class="bt" fill="#1f3a5f">Store + audit log</text>
<text x="1142" y="219" class="bl">• Readings, alerts, refills</text>
<text x="1142" y="243" class="bl">• Doctor-set limits</text>
<text x="1142" y="267" class="bl">• Every tool call is recorded</text>
<text x="1142" y="291" class="bl">• (who, what, why)</text>
<rect x="1480" y="125" width="290" height="215" rx="14" fill="#fff" stroke="#5b7aa6" stroke-width="2.2" filter="url(#sh)"/>

<text x="1502" y="159" class="st">5</text>
<text x="1502" y="187" class="bt" fill="#1f3a5f">Family</text>
<text x="1502" y="219" class="bl">• WhatsApp alerts: amber / red</text>
<text x="1502" y="243" class="bl">• Dashboard: trends, AI audit</text>
<text x="1502" y="267" class="bl">• Approves or rejects refills</text>
<text x="1502" y="291" class="bl">• Red reading: call (mock)</text>
<path d="M334,242.5 L396,242.5" stroke="#35527d" stroke-width="3" marker-end="url(#ah)"/>
<text x="365.0" y="228.5" text-anchor="middle" class="al">photo</text>
<path d="M694,242.5 L756,242.5" stroke="#35527d" stroke-width="3" marker-end="url(#ah)"/>
<text x="725.0" y="228.5" text-anchor="middle" class="al">tools</text>
<path d="M1054,242.5 L1116,242.5" stroke="#35527d" stroke-width="3" marker-end="url(#ah)"/>
<text x="1085.0" y="228.5" text-anchor="middle" class="al">data</text>
<path d="M1414,242.5 L1476,242.5" stroke="#35527d" stroke-width="3" marker-end="url(#ah)"/>
<text x="1445.0" y="228.5" text-anchor="middle" class="al">alerts</text>
<circle cx="306" cy="159" r="15" fill="#2f8f4e" stroke="#fff" stroke-width="2"/><text x="306" y="164" text-anchor="middle" class="bn">1</text>
<circle cx="1722" cy="159" r="15" fill="#2f8f4e" stroke="#fff" stroke-width="2"/><text x="1722" y="164" text-anchor="middle" class="bn">2</text>
<circle cx="1752" cy="159" r="15" fill="#2f8f4e" stroke="#fff" stroke-width="2"/><text x="1752" y="164" text-anchor="middle" class="bn">3</text>
<text x="40" y="372" class="footb">Three human checkpoints: the AI cannot skip any of them</text>
<rect x="40" y="390" width="560" height="118" rx="14" fill="#e8f6ec" stroke="#2f8f4e" stroke-width="2.2" filter="url(#sh)"/>
<circle cx="76" cy="428" r="16" fill="#2f8f4e"/><text x="76" y="434" text-anchor="middle" class="bn">1</text>
<text x="106" y="435" class="cp">The parent confirms the reading</text>
<text x="62" y="468" class="cl">Khayal reads it back; only the parent's 1 makes it</text><text x="62" y="490" class="cl">confirmed. The AI cannot confirm for her.</text>
<rect x="625" y="390" width="560" height="118" rx="14" fill="#e8f6ec" stroke="#2f8f4e" stroke-width="2.2" filter="url(#sh)"/>
<circle cx="661" cy="428" r="16" fill="#2f8f4e"/><text x="661" y="434" text-anchor="middle" class="bn">2</text>
<text x="691" y="435" class="cp">The doctor sets the limits</text>
<text x="647" y="468" class="cl">Alert limits are doctor-set values on the dashboard;</text><text x="647" y="490" class="cl">the server re-checks them. The AI cannot change them.</text>
<rect x="1210" y="390" width="560" height="118" rx="14" fill="#e8f6ec" stroke="#2f8f4e" stroke-width="2.2" filter="url(#sh)"/>
<circle cx="1246" cy="428" r="16" fill="#2f8f4e"/><text x="1246" y="434" text-anchor="middle" class="bn">3</text>
<text x="1276" y="435" class="cp">The family approves refills</text>
<text x="1232" y="468" class="cl">request_refill only creates a request. Approval is a</text><text x="1232" y="490" class="cl">click on the dashboard, not an MCP tool.</text>
<rect x="40" y="545" width="1730" height="100" rx="14" fill="#f4f7fb" stroke="#c9d3e0"/>
<text x="62" y="578" class="footb">What the AI can do: read, log (unconfirmed), remind, request, alert (server-checked).  What it cannot do: confirm, set limits, approve, diagnose.</text>
<text x="62" y="608" class="foot">Built and run in the demo (mock mode): everything shown. Built, not run live: Telegram, WhatsApp via Twilio, Twilio calls.</text>
<text x="62" y="632" class="foot">Design only, not deployed: AWS. Full diagram: docs/architecture.png.</text>
</svg>
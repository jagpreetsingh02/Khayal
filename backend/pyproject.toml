[project]
name = "khayal-backend"
version = "0.1.0"
description = "Khayal backend: FastAPI app (webhooks, simulator, dashboard API) and FastMCP server."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165",
    "fastmcp>=4.2",
    "httpx>=0.28.1",
    "joserfc>=1.8",
    "pillow>=13.0.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4.1",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "live: calls a real external API; skipped unless RUN_LIVE_TESTS=1 (uses your quota)",
]

[tool.mypy]
python_version = "3.11"
files = ["app", "mcp_server"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# No third-party module needed ignore_missing_imports so far; add per-module overrides
# ([[tool.mypy.overrides]] module = "x.*") only when a library ships no types.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

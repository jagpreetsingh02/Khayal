[project]
name = "care-circle-backend"
version = "0.1.0"
description = "Care Circle backend: FastAPI app (webhooks, simulator, dashboard API) and FastMCP server."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165",
    "fastmcp>=4.2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "live: calls a real external API; skipped unless RUN_LIVE_TESTS=1 (uses your quota)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
